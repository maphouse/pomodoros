<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pomodoros</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: ui-monospace, "Cascadia Mono", "Roboto Mono", "Fira Mono", "Droid Sans Mono", monospace;
  background: #000;
  color: #eee;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.duration-picker {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.dur-btn {
  border: 2px solid #222;
  border-radius: 20px;
  padding: 8px 20px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  background: transparent;
  color: #888;
  cursor: pointer;
  transition: all 0.15s;
}

.dur-btn.active {
  border-color: #e74c3c;
  color: #eee;
  background: rgba(231, 76, 60, 0.15);
}

.dur-btn:active { opacity: 0.7; }

.pie {
  position: relative;
  width: 90vw;
  aspect-ratio: 1;
  margin-bottom: 10px;
  cursor: pointer;
  flex-shrink: 1;
  min-height: 0;
  -webkit-tap-highlight-color: transparent;
}

.pie svg { width: 100%; height: 100%; }

.time-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
  color: #fff;
  opacity: 0;
  pointer-events: none;
}

.time-overlay.visible { opacity: 1; transition: none; }
.time-overlay.fading { opacity: 0; transition: opacity 1s ease; }

.controls {
  display: flex;
  gap: 10px;
  width: 72vw;
}

.controls button {
  border: none;
  border-radius: 50%;
  flex: 1;
  aspect-ratio: 1;
  padding: 0;
  font-size: 22px;
  text-align: center;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controls button:active { opacity: 0.7; }

.btn-start { background: #e74c3c; color: #fff; }
.btn-start.running { background: #c0392b; }
.btn-start.breaking { background: #27ae60; }
.btn-reset { background: #222; color: #aaa; }
.btn-reset svg { width: 40%; height: 40%; }
.tick-dial {
  flex: 1;
  aspect-ratio: 1;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.tick-dial svg { width: 100%; height: 100%; }

.done-banner {
  position: fixed;
  top: 0; left: 0; right: 0;
  text-align: center;
  padding: 12px;
  font-weight: 700;
  font-size: 14px;
  transform: translateY(-100%);
  transition: transform 0.3s ease;
  z-index: 10;
}

.done-banner.visible { transform: translateY(0); }

.history {
  margin-top: 16px;
  font-size: 12px;
  color: #666;
  text-align: center;
}

.history strong { color: #aaa; }

.footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  text-align: center;
  padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  font-size: 11px;
  color: #333;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<div class="duration-picker" id="dur-picker">
  <button class="dur-btn" data-mins="25">25 min</button>
  <button class="dur-btn active" data-mins="50">50 min</button>
</div>

<div class="pie" id="pie">
  <svg viewBox="0 0 260 260">
    <path id="red-slice" fill="#e74c3c"/>
    <path id="green-slice" fill="#2ecc71"/>
  </svg>
  <div class="time-overlay" id="time-overlay"></div>
</div>

<div class="controls">
  <button class="btn-reset" id="btn-reset" aria-label="Reset"><svg viewBox="0 0 512 512"><path transform="rotate(45,256,256)" d="M257.21 0.08C257.35 0.08 257.49 0.08 257.63 0.08C257.86 24.82 258.1 49.57 258.34 74.32C263.35 75.24 268.68 74.77 273.77 75.14C281.44 75.7 289.11 76.87 296.66 78.18C326.27 83.34 354.37 95.79 379.31 112.36C450.99 159.96 489.6 253.01 470.74 337.32C462.92 372.27 447.77 403.37 425.72 431.57C399.69 464.86 362.05 488.59 322.45 501.83C311.4 505.52 299.76 507.92 288.26 509.67C283.5 510.4 274.24 509.95 270.32 511.92C260.95 511.92 251.59 511.92 242.22 511.92C239.57 510.48 235.89 511.2 232.94 510.81C226.26 509.92 219.63 508.89 213 507.71C195.5 504.6 178.25 498.2 162.21 490.73C105.24 464.21 63.36 411.97 45.82 352.33C42.13 339.79 40.08 327.01 38.66 314C37.95 307.56 36.73 299.77 37.99 293.41C58.27 293.41 78.54 293.41 98.82 293.41C99.44 296.26 99.07 299.35 99.3 302.27C99.89 309.74 100.73 317.2 102.16 324.55C106.57 347.24 116.76 368.46 130.27 387.11C185.71 463.67 302.05 471.74 367.8 404.04C383.46 387.91 395.96 369.05 403.83 348C430.99 275.29 400.39 195.65 334.36 156.82C317.62 146.98 298.67 140.45 279.42 137.78C272.83 136.86 264.61 134.94 258.04 136.3C257.83 160.74 257.61 185.18 257.4 209.62C207.16 174.9 156.92 140.17 106.68 105.44C156.85 70.32 207.03 35.2 257.21 0.08Z" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="0.25" stroke-linejoin="round"/></svg></button>
  <button class="btn-start" id="btn-start" aria-label="Start">&#x25b6;</button>
  <div class="tick-dial" id="tick-dial">
    <svg viewBox="0 0 64 64" style="overflow:visible">
      <circle cx="32" cy="32" r="32" fill="#222" id="dial-bg"/>
      <path id="dial-track" fill="none" stroke="#888" stroke-width="3.75" stroke-linecap="round"/>
      <path id="dial-fill" fill="none" stroke="#3498db" stroke-width="3.75" stroke-linecap="round"/>
      <g transform="translate(19,20) scale(1.1)" fill="#555" id="dial-icon">
        <path d="M12 1a9 9 0 0 0-9 9v4a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6v-1a6 6 0 1 1 12 0v1h-1a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-4a9 9 0 0 0-9-9z"/>
      </g>
    </svg>
  </div>
</div>

<div class="done-banner" id="banner"></div>

<div class="history" id="history"></div>

<div class="footer" id="footer">Keep open so the chat can receive notifications.</div>

<script src="webxdc.js"></script>
<script>
(function () {
  "use strict";

  var CX = 130, CY = 130, R = 115;
  var PLAY = '<svg width="40%" height="40%" viewBox="0 0 20 20"><polygon points="4,2 18,10 4,18" fill="currentColor"/></svg>';
  var PAUSE_ICON = '<svg width="40%" height="40%" viewBox="0 0 20 20"><rect x="3" y="2" width="5" height="16" rx="1" fill="currentColor"/><rect x="12" y="2" width="5" height="16" rx="1" fill="currentColor"/></svg>';

  var redSlice = document.getElementById("red-slice");
  var greenSlice = document.getElementById("green-slice");
  var pieEl = document.getElementById("pie");
  var timeOverlay = document.getElementById("time-overlay");
  var startBtn = document.getElementById("btn-start");
  var resetBtn = document.getElementById("btn-reset");
  var banner = document.getElementById("banner");
  var historyEl = document.getElementById("history");
  var durPicker = document.getElementById("dur-picker");
  var footerEl = document.getElementById("footer");
  var durBtns = durPicker.querySelectorAll(".dur-btn");
  var tickDial = document.getElementById("tick-dial");
  var dialTrack = document.getElementById("dial-track");
  var dialFill = document.getElementById("dial-fill");
  var dialBg = document.getElementById("dial-bg");
  var dialIcon = document.getElementById("dial-icon");

  var focusDuration = 50 * 60;
  var activeDurationMins = 50;
  var state = "idle";
  var phase = "focus";
  var endTime = 0;
  var pausedRemaining = focusDuration;
  var completedCount = 0;
  var handled = {};
  var counted = {};

  var localInterval = null;
  var audioCtx = null;
  var lastSummaryUpdate = 0;
  // Cadence of the chatlist summary. Every send is a real (invisible) message on
  // the Delta Chat transport, so stay well above sendUpdateInterval (10s).
  var SUMMARY_INTERVAL = 60000;
  var SUMMARY_MIN_GAP = 10000;
  var overlayTimeout = null;
  var _storedDial = parseInt(localStorage.getItem("tickDial") || "0", 10);
  var tickDialValue = _storedDial > 0 ? _storedDial : 30;
  var tickEnabled = localStorage.getItem("tickEnabled") !== null
      ? localStorage.getItem("tickEnabled") === "1"
      : _storedDial > 0;
  var focusDialValue = parseInt(localStorage.getItem("focusDial") || String(tickDialValue), 10);
  var lastTickSecond = -1;
  var tickOutput = null;
  var washSource = null;
  var washGain = null;
  var washFilter = null;
  var WASH_THRESHOLD = 95;
  var doneTime = 0;
  var doneInterval = null;

  function countCompletion(key) {
    if (counted[key]) return;
    counted[key] = true;
    completedCount++;
  }

  function breakDuration() {
    return activeDurationMins === 50 ? 600 : 300;
  }

  function xy(angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return [CX + R * Math.cos(rad), CY + R * Math.sin(rad)];
  }

  function sectorPath(startAngle, endAngle) {
    var span = endAngle - startAngle;
    if (span < 0.5) return "";
    if (span >= 359.5) {
      return "M" + CX + "," + (CY - R) +
             "A" + R + "," + R + " 0 1,1 " + CX + "," + (CY + R) +
             "A" + R + "," + R + " 0 1,1 " + CX + "," + (CY - R) + "Z";
    }
    var s = xy(startAngle);
    var e = xy(endAngle);
    var large = span > 180 ? 1 : 0;
    return "M" + CX + "," + CY +
           "L" + s[0].toFixed(2) + "," + s[1].toFixed(2) +
           "A" + R + "," + R + " 0 " + large + ",1 " +
           e[0].toFixed(2) + "," + e[1].toFixed(2) + "Z";
  }

  function fmt(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function fmtMins(s) {
    return Math.ceil(s / 60) + "min";
  }

  function getRemaining() {
    if (state === "running") return Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    if (state === "done") return 0;
    return pausedRemaining;
  }

  function setDuration(mins) {
    focusDuration = mins * 60;
    activeDurationMins = mins;
    pausedRemaining = focusDuration;
  }

  function updateDurBtns() {
    for (var i = 0; i < durBtns.length; i++) {
      durBtns[i].classList.toggle("active", parseInt(durBtns[i].dataset.mins) === activeDurationMins);
    }
  }

  // --- time overlay on tap ---

  // Persistent = always shown, no auto-fade: paused, <=5min remaining, or
  // the up-to-1hr overtime count-up after a full cycle completes.
  function overlayState() {
    var r = getRemaining();
    if (state === "done") {
      var elapsed = doneTime ? Math.floor((Date.now() - doneTime) / 1000) : Infinity;
      if (elapsed < 0) elapsed = 0;
      if (elapsed <= 3600) return { persistent: true, text: "-" + fmt(elapsed) };
      return { persistent: false, text: "" };
    }
    if (state === "paused") return { persistent: true, text: fmt(r) };
    if (state === "running" && r <= 300) return { persistent: true, text: fmt(r) };
    return { persistent: false, text: fmt(r) };
  }

  function showTimeOverlay() {
    var ov = overlayState();
    timeOverlay.textContent = ov.text;
    timeOverlay.classList.remove("fading");
    timeOverlay.classList.add("visible");
    if (overlayTimeout) { clearTimeout(overlayTimeout); overlayTimeout = null; }
    if (ov.persistent) return;
    overlayTimeout = setTimeout(function () {
      timeOverlay.classList.add("fading");
      timeOverlay.classList.remove("visible");
      overlayTimeout = null;
    }, 5000);
  }

  pieEl.addEventListener("click", showTimeOverlay);

  function startDoneTick() {
    stopDoneTick();
    doneInterval = setInterval(function () {
      if (state !== "done") { stopDoneTick(); return; }
      render();
      if (Date.now() - doneTime > 3600000) stopDoneTick();
    }, 1000);
  }

  function stopDoneTick() {
    if (doneInterval) { clearInterval(doneInterval); doneInterval = null; }
  }

  function render() {
    var r = getRemaining();
    var ov = overlayState();

    if (ov.persistent) {
      timeOverlay.textContent = ov.text;
      timeOverlay.classList.remove("fading");
      timeOverlay.classList.add("visible");
      if (overlayTimeout) { clearTimeout(overlayTimeout); overlayTimeout = null; }
    } else if (timeOverlay.classList.contains("visible") && !overlayTimeout) {
      timeOverlay.classList.add("fading");
      timeOverlay.classList.remove("visible");
    } else if (timeOverlay.classList.contains("visible")) {
      timeOverlay.textContent = ov.text;
    }

    if (phase === "focus") {
      var fe;
      if (state === "running") fe = 1 - r / focusDuration;
      else if (state === "paused") fe = 1 - pausedRemaining / focusDuration;
      else fe = 0;
      redSlice.setAttribute("d", sectorPath(fe * 300, 300));
      greenSlice.setAttribute("d", sectorPath(300, 360));
    } else {
      redSlice.setAttribute("d", "");
      var bd = breakDuration();
      var be;
      if (state === "done") be = 1;
      else if (state === "running") be = 1 - r / bd;
      else if (state === "paused") be = 1 - pausedRemaining / bd;
      else be = 0;
      greenSlice.setAttribute("d", sectorPath(300 + be * 60, 360));
    }

    var active = state === "running" || state === "paused";
    durPicker.style.opacity = active || phase === "break" ? "0.3" : "1";
    durPicker.style.pointerEvents = active || phase === "break" ? "none" : "auto";

    startBtn.classList.remove("running", "breaking");
    if (state === "running" && phase === "focus") {
      startBtn.innerHTML = PAUSE_ICON;
      startBtn.classList.add("running");
    } else if (state === "running" && phase === "break") {
      startBtn.innerHTML = PAUSE_ICON;
      startBtn.classList.add("breaking");
    } else {
      startBtn.innerHTML = PLAY;
    }

    footerEl.style.display = state === "running" ? "" : "none";

    if (completedCount > 0) {
      historyEl.innerHTML = completedCount + " 🍅";
    } else {
      historyEl.textContent = "";
    }
  }

  function summaryText() {
    var r = getRemaining();
    return (phase === "focus" ? "▶ " : "☕ ") + fmtMins(r);
  }

  function sendSummary(text) {
    lastSummaryUpdate = Date.now();
    window.webxdc.sendUpdate({
      payload: { type: "tick" },
      summary: text
    }, "");
  }

  function updateSummary() {
    if (Date.now() - lastSummaryUpdate < SUMMARY_INTERVAL) return;
    sendSummary(summaryText());
  }

  function startLocalTick() {
    stopLocalTick();
    lastTickSecond = getRemaining();
    localInterval = setInterval(function () {
      if (state !== "running") { stopLocalTick(); return; }
      render();
      updateSummary();
      var r = getRemaining();
      var eff = effectiveDialValue();
      if (eff > 0 && eff < WASH_THRESHOLD && r !== lastTickSecond && r >= 0) {
        var shouldTick = phase === "focus" || (r % 2 === 0);
        lastTickSecond = r;
        if (shouldTick) playTick();
      } else {
        lastTickSecond = r;
      }
      if (r <= 0) {
        stopLocalTick();
        if (phase === "focus") onFocusExpired();
        else onBreakExpired();
      }
    }, 250);
    if (effectiveDialValue() >= WASH_THRESHOLD) startWash();
  }

  function stopLocalTick() {
    if (localInterval) { clearInterval(localInterval); localInterval = null; }
    stopWash();
  }

  function onFocusExpired() {
    var key = "f-" + endTime;
    if (handled[key]) return;
    handled[key] = true;

    countCompletion(key);
    playFocusAlarm();
    showBanner("✓", "#2ecc71");

    var bd = breakDuration();
    var be = Date.now() + bd * 1000;

    window.webxdc.sendUpdate({
      payload: { type: "focusComplete", focusEnd: endTime, breakEnd: be },
      info: "📝 ✓",
      summary: "☕ " + fmtMins(bd),
      notify: { "*": "📝 ✓" }
    }, "");

    lastSummaryUpdate = Date.now();
    phase = "break";
    endTime = be;
    state = "running";
    startLocalTick();
    render();
  }

  function onBreakExpired() {
    var key = "b-" + endTime;
    if (handled[key]) return;
    handled[key] = true;

    state = "done";
    doneTime = endTime;
    startDoneTick();
    playBreakAlarm();
    showBanner("☕ ✓", "#3498db");

    window.webxdc.sendUpdate({
      payload: { type: "breakComplete", breakEnd: endTime },
      info: "☕ ✓",
      summary: "🍅",
      notify: { "*": "☕ ✓" }
    }, "");

    render();
  }

  function showBanner(text, color) {
    banner.textContent = text;
    banner.style.background = color;
    banner.style.color = "#000";
    banner.classList.add("visible");
    setTimeout(function () { banner.classList.remove("visible"); }, 4000);
  }

  function primeAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        tickOutput = audioCtx.createGain();
        tickOutput.gain.value = 1.0;
        tickOutput.connect(audioCtx.destination);
      } catch (e) {}
    }
  }

  function playFocusAlarm() {
    try {
      primeAudio();
      var beeps = [
        { freq: 880, start: 0, dur: 0.15 },
        { freq: 880, start: 0.25, dur: 0.15 },
        { freq: 880, start: 0.5, dur: 0.15 },
        { freq: 1100, start: 0.85, dur: 0.3 }
      ];
      var now = audioCtx.currentTime;
      for (var i = 0; i < beeps.length; i++) {
        var b = beeps[i];
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = b.freq;
        gain.gain.setValueAtTime(0.25, now + b.start);
        gain.gain.exponentialRampToValueAtTime(0.001, now + b.start + b.dur);
        osc.connect(gain);
        gain.connect(tickOutput);
        osc.start(now + b.start);
        osc.stop(now + b.start + b.dur + 0.05);
      }
    } catch (e) {}
  }

  function playBreakAlarm() {
    try {
      primeAudio();
      var notes = [
        { freq: 523, start: 0, dur: 0.3 },
        { freq: 392, start: 0.35, dur: 0.3 },
        { freq: 330, start: 0.7, dur: 0.5 }
      ];
      var now = audioCtx.currentTime;
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = n.freq;
        gain.gain.setValueAtTime(0.2, now + n.start);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);
        osc.connect(gain);
        gain.connect(tickOutput);
        osc.start(now + n.start);
        osc.stop(now + n.start + n.dur + 0.05);
      }
    } catch (e) {}
  }

  function effectiveDialValue() {
    if (!tickEnabled) return 0;
    if (phase === "break") return 1;
    return tickDialValue;
  }

  function dialT() {
    return Math.pow(effectiveDialValue() / 100, 6);
  }

  function playTick() {
    try {
      primeAudio();
      if (!tickOutput) return;
      var t = dialT();
      var isBreak = phase === "break";
      var attack = 0.001;
      var sustain = t * 1.3;
      var decay = 0.02 + t * 0.4;
      var total = attack + sustain + decay;
      var tickInt = isBreak ? 2 : 1;
      var layers = Math.max(1, Math.ceil(total / tickInt));
      var baseVol = isBreak ? 0.16 : 0.26;
      var vol = baseVol * (1 + t * 1.5) / Math.sqrt(layers);
      var q = 0.5 + t * 9;
      var freq = 528 + t * 12;
      if (isBreak) { q *= 0.7; freq = 400 + t * 100; }
      var sr = audioCtx.sampleRate;
      var len = Math.floor(sr * (total + 0.05));
      var buf = audioCtx.createBuffer(1, len, sr);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = freq;
      bp.Q.value = q;
      var g = audioCtx.createGain();
      var now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(vol, now + attack);
      g.gain.setValueAtTime(vol, now + attack + sustain);
      g.gain.exponentialRampToValueAtTime(0.001, now + total);
      src.connect(bp);
      bp.connect(g);
      g.connect(tickOutput);
      src.start(now);
    } catch (e) {}
  }

  function washVolume() {
    var t = dialT();
    var base = phase === "break" ? 0.16 : 0.26;
    return base * (1 + t * 1.5);
  }

  function startWash() {
    if (effectiveDialValue() < WASH_THRESHOLD) return;
    stopWash();
    primeAudio();
    if (!audioCtx || !tickOutput) return;
    try {
      var t = dialT();
      var sr = audioCtx.sampleRate;
      var len = sr * 2;
      var buf = audioCtx.createBuffer(1, len, sr);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      washFilter = audioCtx.createBiquadFilter();
      washFilter.type = "bandpass";
      washFilter.frequency.value = 528;
      washFilter.Q.value = 0.5 + t * 9;
      washGain = audioCtx.createGain();
      var now = audioCtx.currentTime;
      washGain.gain.setValueAtTime(0.001, now);
      washGain.gain.linearRampToValueAtTime(washVolume(), now + 0.3);
      src.connect(washFilter);
      washFilter.connect(washGain);
      washGain.connect(tickOutput);
      src.start();
      washSource = src;
    } catch (e) {}
  }

  function stopWash() {
    if (washGain && audioCtx) {
      try {
        var now = audioCtx.currentTime;
        washGain.gain.cancelScheduledValues(now);
        washGain.gain.setValueAtTime(washGain.gain.value, now);
        washGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        if (washSource) washSource.stop(now + 0.6);
      } catch (e) {}
    }
    washSource = null;
    washGain = null;
    washFilter = null;
  }

  function updateWashParams() {
    if (!washGain || !washFilter || !audioCtx) return;
    if (effectiveDialValue() < WASH_THRESHOLD) { stopWash(); return; }
    try {
      var t = dialT();
      var now = audioCtx.currentTime;
      washGain.gain.cancelScheduledValues(now);
      washGain.gain.setValueAtTime(washGain.gain.value, now);
      washGain.gain.linearRampToValueAtTime(washVolume(), now + 0.05);
      washFilter.Q.value = 0.5 + t * 9;
    } catch (e) {}
  }

  var DIAL_CX = 32, DIAL_CY = 32, DIAL_R = 26;
  var DIAL_START = 210, DIAL_SWEEP = 300;

  function dialXY(deg) {
    var rad = deg * Math.PI / 180;
    return [DIAL_CX + DIAL_R * Math.sin(rad), DIAL_CY - DIAL_R * Math.cos(rad)];
  }

  function dialArcPath(fromDeg, toDeg) {
    var sweep = toDeg - fromDeg;
    if (sweep <= 0) return "";
    var s = dialXY(fromDeg);
    var e = dialXY(toDeg);
    var large = sweep > 180 ? 1 : 0;
    return "M" + s[0].toFixed(1) + "," + s[1].toFixed(1) +
           "A" + DIAL_R + "," + DIAL_R + " 0 " + large + ",1 " +
           e[0].toFixed(1) + "," + e[1].toFixed(1);
  }

  function renderTickDial() {
    var endDeg = DIAL_START + (tickDialValue / 100) * DIAL_SWEEP;
    dialTrack.setAttribute("d", dialArcPath(DIAL_START, DIAL_START + DIAL_SWEEP));
    dialFill.setAttribute("d", dialArcPath(DIAL_START, endDeg));
    dialFill.setAttribute("stroke", tickEnabled ? "#3498db" : "#555");
    dialBg.setAttribute("fill", tickEnabled ? "rgba(52,152,219,0.15)" : "#222");
    dialIcon.setAttribute("fill", tickEnabled ? "#3498db" : "#555");
  }

  function applyUpdate(p) {
    if (!p || !p.type) return;

    if (p.type === "start") {
      stopDoneTick();
      doneTime = 0;
      phase = "focus";
      state = "running";
      endTime = p.endTime;
      if (p.durationMins) {
        setDuration(p.durationMins);
        updateDurBtns();
      }
      startLocalTick();

    } else if (p.type === "pause") {
      stopLocalTick();
      state = "paused";
      pausedRemaining = p.remaining;
      if (p.phase) phase = p.phase;

    } else if (p.type === "resume") {
      state = "running";
      endTime = p.endTime;
      if (p.phase) phase = p.phase;
      startLocalTick();

    } else if (p.type === "reset") {
      stopLocalTick();
      stopDoneTick();
      doneTime = 0;
      state = "idle";
      phase = "focus";
      if (p.durationMins) {
        setDuration(p.durationMins);
        updateDurBtns();
      }
      pausedRemaining = focusDuration;
      banner.classList.remove("visible");

    } else if (p.type === "focusComplete") {
      handled["f-" + p.focusEnd] = true;
      countCompletion("f-" + p.focusEnd);
      phase = "break";
      state = "running";
      endTime = p.breakEnd;
      startLocalTick();

    } else if (p.type === "breakComplete") {
      handled["b-" + p.breakEnd] = true;
      stopLocalTick();
      state = "done";
      doneTime = p.breakEnd;
      startDoneTick();

    } else if (p.type === "completed") {
      handled["f-" + p.endTime] = true;
      stopLocalTick();
      state = "done";
      countCompletion("f-" + p.endTime);
      doneTime = p.endTime;
      startDoneTick();
    }

    render();
  }

  for (var i = 0; i < durBtns.length; i++) {
    durBtns[i].addEventListener("click", function () {
      var mins = parseInt(this.dataset.mins);
      setDuration(mins);
      updateDurBtns();
      window.webxdc.sendUpdate({
        payload: { type: "reset", durationMins: mins },
        summary: "🍅"
      }, "");
      render();
    });
  }

  startBtn.addEventListener("click", function () {
    primeAudio();

    if (state === "running") {
      var r = getRemaining();
      window.webxdc.sendUpdate({
        payload: { type: "pause", remaining: r, phase: phase },
        summary: "⏸ " + fmtMins(r)
      }, "");
      applyUpdate({ type: "pause", remaining: r, phase: phase });

    } else if (state === "paused") {
      var secs = pausedRemaining;
      var et = Date.now() + secs * 1000;
      window.webxdc.sendUpdate({
        payload: { type: "resume", endTime: et, phase: phase },
        summary: (phase === "focus" ? "▶ " : "☕ ") + fmtMins(secs)
      }, "");
      lastSummaryUpdate = Date.now();
      applyUpdate({ type: "resume", endTime: et, phase: phase });
      showTimeOverlay();

    } else {
      var et = Date.now() + focusDuration * 1000;
      var name = window.webxdc.selfName || "Someone";
      window.webxdc.sendUpdate({
        payload: { type: "start", endTime: et, durationMins: activeDurationMins },
        info: name + " ▶ " + activeDurationMins + "min pomodoro",
        summary: "▶ " + fmtMins(focusDuration),
        notify: { "*": name + " ▶ " + activeDurationMins + "min pomodoro" }
      }, "");
      lastSummaryUpdate = Date.now();
      applyUpdate({ type: "start", endTime: et, durationMins: activeDurationMins });
      showTimeOverlay();
    }
  });

  resetBtn.addEventListener("click", function () {
    window.webxdc.sendUpdate({
      payload: { type: "reset", durationMins: activeDurationMins },
      summary: "🍅"
    }, "");
    applyUpdate({ type: "reset", durationMins: activeDurationMins });
    showTimeOverlay();
  });

  function updateDialFromPointer(e) {
    var rect = tickDial.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var angle = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    var offset = angle - DIAL_START;
    if (offset < 0) offset += 360;
    if (offset > DIAL_SWEEP) {
      tickDialValue = offset > DIAL_SWEEP + 30 ? 1 : 100;
    } else {
      tickDialValue = Math.max(1, Math.round(offset / DIAL_SWEEP * 100));
    }
    focusDialValue = tickDialValue;
    localStorage.setItem("tickDial", String(tickDialValue));
    localStorage.setItem("focusDial", String(focusDialValue));
    renderTickDial();
    if (state === "running") {
      var eff = effectiveDialValue();
      if (eff >= WASH_THRESHOLD) {
        if (!washSource) startWash();
        else updateWashParams();
      } else {
        if (washSource) stopWash();
      }
    }
  }

  tickDial.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    primeAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    var rect = tickDial.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var innerR = rect.width * 0.32;
    var startX = e.clientX, startY = e.clientY;
    var dragged = false;
    function onMove(ev) {
      ev.preventDefault();
      if (Math.sqrt(Math.pow(ev.clientX - startX, 2) + Math.pow(ev.clientY - startY, 2)) > 5) dragged = true;
      if (dragged) updateDialFromPointer(ev);
    }
    function onUp() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      if (!dragged && dist < innerR) {
        tickEnabled = !tickEnabled;
        localStorage.setItem("tickEnabled", tickEnabled ? "1" : "0");
        renderTickDial();
        if (state === "running") {
          var eff = effectiveDialValue();
          if (eff >= WASH_THRESHOLD && !washSource) startWash();
          else if (eff < WASH_THRESHOLD || !tickEnabled) stopWash();
        }
      }
      showTimeOverlay();
    }
    if (dist >= innerR) {
      updateDialFromPointer(e);
      dragged = true;
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });

  // Coming back to the app refreshes the summary at once, rather than leaving a
  // snapshot up to SUMMARY_INTERVAL stale sitting in the chatlist. Rate-floored
  // so flipping between apps cannot outpace sendUpdateInterval.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || state !== "running") return;
    if (Date.now() - lastSummaryUpdate < SUMMARY_MIN_GAP) return;
    sendSummary(summaryText());
    render();
  });

  window.webxdc.setUpdateListener(function (update) {
    applyUpdate(update.payload);
  }, 0);

  setTimeout(function () {
    if (state === "running" && getRemaining() <= 0) {
      if (phase === "focus") onFocusExpired();
      else onBreakExpired();
    }
  }, 0);

  render();
  renderTickDial();
})();
</script>
</body>
</html>
